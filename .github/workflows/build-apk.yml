name: Build standalone APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebuild, merge native libraries and verify
        env:
          APK_SIGNING_KEYSTORE: ${{ secrets.APK_SIGNING_KEYSTORE }}
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: bash scripts/build.sh
      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            out/*.log
            out/*.json
            out/*.txt
          if-no-files-found: ignore
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: heesay-v4-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            out/HeeSay-5.11.6-v4-universal.apk \
            out/SHA256SUMS.txt \
            out/checks.json \
            out/signing.json \
            --target "$GITHUB_SHA" \
            --title "HeeSay 5.11.6 v4 — APK đơn (build $GITHUB_RUN_NUMBER)" \
            --notes-file docs/RELEASE.vi.md
